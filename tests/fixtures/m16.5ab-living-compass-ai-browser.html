<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="../../">
  <title>Luvia Compass AI – sichtbare Abnahme</title>
  <link rel="stylesheet" href="core/design/design-system-v3.css?v=13.82.116-ai">
  <link rel="stylesheet" href="core/experience/experience-foundation.css?v=13.82.116-ai2">
  <link rel="stylesheet" href="core/ai/ai-brain.css?v=13.82.116-ai">
  <style>
    html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#f5fbfb,#fff4f1);font-family:Inter,Arial,sans-serif;color:#102d3f}
    main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main>section{width:min(760px,100%);padding:clamp(24px,6vw,68px);border:1px solid rgba(16,45,63,.1);border-radius:36px;background:rgba(255,255,255,.76);box-shadow:0 30px 90px rgba(18,56,77,.12)}
    main h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.94;letter-spacing:-.055em;margin:0 0 18px}main p{max-width:58ch;color:#667f91;line-height:1.6}
    main button{min-height:52px;margin-top:16px;padding:0 22px;border:0;border-radius:999px;background:#ef675a;color:white;font:inherit;font-weight:800}
  </style>
</head>
<body>
  <main>
    <section>
      <small>Luvia · sichere Owner-Orchestrierung</small>
      <h1>Ein Satz.<br>Mehrere sichere Schritte.</h1>
      <p>Diese Abnahme öffnet die echte, appweit verwendete Luvia-Compass-Oberfläche. Sie bleibt ein weiches Bottom-Sheet und führt Änderungen nur über die zuständigen Owner-Contracts aus.</p>
      <button type="button" data-ai-ask-open>Luvia Compass öffnen</button>
    </section>
  </main>
  <script>
    window.LuviaTripContractV1={getActiveTrip:()=>({id:'trip-scharbeutz',title:'Ostseeurlaub',destination:{name:'Scharbeutz'}})};
    window.LuviaApp={activeView:()=> 'timeline'};
    window.LuviaIntelligenceContractV1={
      ask:async request=>({data:{answer:`Ich habe verstanden: „${request}“. Places, Timeline und Booking werden getrennt geprüft; ändern darf ich erst nach deiner Bestätigung.`}}),
      run:async()=>({data:{headline:'Luvia ist bereit.',message:'Die Cores bleiben Owner ihrer Daten.',highlights:[]},meta:{fallback:false}})
    };
    window.LuviaAIActionRuntime={
      runMessage:async request=>({handled:false,request,results:[]}),
      prepare:()=>({requiresConfirmation:false}),execute:async()=>({}),cancel:()=>({}),retry:async()=>({}),diagnostics:()=>({ready:true})
    };
  </script>
  <script src="core/experience/experience-contract-core.js?v=13.82.116-ai"></script>
  <script src="app/adapters/experience-web-adapter.js?v=13.82.116-ai"></script>
  <script src="core/runtime/overlay-host-contract-core.js?v=13.82.116-ai"></script>
  <script src="core/ui/ui-manager.js?v=13.82.116-ai"></script>
  <script src="core/ai/ai-dashboard-service.js?v=13.82.116-ai"></script>
  <script>
    document.addEventListener('click',event=>{if(event.target.closest('[data-ai-ask-open]'))window.LuviaAIDashboard.openChat()});
    window.LuviaAIDashboard.openChat();
  </script>
</body>
</html>
