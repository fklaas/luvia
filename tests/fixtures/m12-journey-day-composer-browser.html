<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <title>M12 Journey Day Composer Browser Fixture</title>
  <link rel="stylesheet" href="../../core/experience/experience-foundation.css">
  <link rel="stylesheet" href="../../app/journey/journey-day-composer.css">
  <link rel="stylesheet" href="../../core/booking/booking-ui.css">
  <style>
    :root{--lv-text:#263f54;--lv-muted:#687b8c;--lv-line:#dfe6ea}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f6f3f1,#edf4f5);font-family:Manrope,system-ui,sans-serif;color:var(--lv-text)}
    main{width:min(1180px,calc(100% - 32px));margin:32px auto;padding:28px;border:1px solid rgba(38,63,84,.08);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(38,63,84,.12)}
    .fixture-overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(24,39,52,.5);backdrop-filter:blur(8px)}
    @media(max-width:560px){main{width:100%;margin:0;padding:18px 14px;border:0;border-radius:0;min-height:100dvh}.fixture-overlay{align-items:end;padding:0}}
  </style>
</head>
<body>
  <main data-fixture-root aria-label="Journey Day Composer Vorschau"></main>
  <script src="../../core/journey/journey-domain-contract-core.js"></script>
  <script>
    (()=>{
      const source={tripId:'trip-paris',hydrated:true,entries:[
        {id:'schedule-breakfast',source:'schedule',tripId:'trip-paris',entityType:'restaurant',title:'Frühstück im Marais',startAt:'2026-08-24T08:30:00.000Z',endAt:'2026-08-24T09:45:00.000Z',placeId:'place-cafe'},
        {id:'place-louvre',source:'place-data',tripId:'trip-paris',entityType:'attraction',title:'Louvre – Denon Flügel',startAt:'2026-08-24T09:30:00.000Z',durationMinutes:120,placeId:'place-louvre',tripPlaceId:'trip-place-louvre'},
        {id:'visit-seine',source:'gps',tripId:'trip-paris',entityType:'nature',title:'Spaziergang an der Seine',startAt:'2026-08-24T13:30:00.000Z',durationMinutes:75,placeId:'place-seine',automatic:true},
        {id:'memory-sunset',source:'event',tripId:'trip-paris',entityType:'photo_memory',kind:'photo_memory',title:'Goldene Stunde am Pont Neuf',startAt:'2026-08-25T19:15:00.000Z',durationMinutes:30,metadata:{mediaIds:['media-1','media-2']}},
        {id:'schedule-dinner',source:'schedule',tripId:'trip-paris',entityType:'restaurant',title:'Abendessen mit Aussicht',startAt:'2026-08-26T18:30:00.000Z',durationMinutes:120,placeId:'place-dinner'}
      ]};
      globalThis.LuviaTimelineCore={snapshot:()=>source,subscribe:()=>()=>{},diagnostics:()=>({cloudAuthoritative:true,realtime:true,metrics:{queued:0}}),hydrate:async()=>source,init:async()=>source,record:async()=>source,removeEntry:async()=>true,clearEntries:async()=>source,removePhotoMemoryByCluster:async()=>true,openPhotoMemory:()=>null,editEntry:()=>null,openPlanningEditor:()=>null};
      globalThis.LuviaTripContractV1={getActiveTrip:()=>({id:'trip-paris',title:'Paris zu zweit',destination:{name:'Paris'},startDate:'2026-08-24',endDate:'2026-08-27'})};
      globalThis.LuviaExperienceContractV1={contractId:'experience.v1'};
      globalThis.LuviaGlobalContracts={register:()=>{}};
      const suggestions=[
        {id:'fixture-garden',providerPlaceId:'fixture-garden',name:'Jardin du Luxembourg',primaryType:'park',formattedAddress:'75006 Paris, Frankreich',rating:4.7,userRatingCount:118000,aiReasons:['Ruhiger Außenmoment zwischen euren bestätigten Stationen.'],image:{url:'assets/public-landing/travel-lisbon.webp'}},
        {id:'fixture-museum',providerPlaceId:'fixture-museum',name:'Musée de la Vie Romantique',primaryType:'museum',formattedAddress:'16 Rue Chaptal, Paris',rating:4.6,userRatingCount:5600,aiReasons:['Kultur und gemeinsame Zeit ergänzen euren Tag ohne Dopplung.'],image:{url:'assets/public-landing/book-city-night.jpg'}},
        {id:'fixture-cafe',providerPlaceId:'fixture-cafe',name:'Café de Flore',primaryType:'cafe',formattedAddress:'172 Boulevard Saint-Germain, Paris',rating:4.1,userRatingCount:29000,aiReasons:['Ein Genussmoment, weil im gewählten Zeitfenster noch keine Mahlzeit liegt.'],image:{url:'assets/public-landing/prototype-harbor-lunch.png'}}
      ];
      globalThis.__journeySuggestionReceipts=[];
      globalThis.__journeyBookingReceipts=[];
      globalThis.__fixtureBookingRouteMode=new URL(location.href).searchParams.get('bookingRoute')||'email';
      globalThis.LuviaOwnerFlowNavigationV1={
        reserveBookingHandoff:()=>({closed:false,close(){this.closed=true}}),
        openBooking:(url)=>{globalThis.__journeyBookingReceipts.push({kind:'provider-open',url});return true}
      };
      globalThis.LuviaBooking={
        init:async()=>({ready:true}),
        resolvePlaceRoute:async place=>{
          globalThis.__journeyBookingReceipts.push({kind:'route-resolve',place});
          if(globalThis.__fixtureBookingRouteMode==='provider')return{resolved:true,channel:'external_link',provider:'thefork',value:'https://www.thefork.de/',reason:'VERIFIED_BOOKING_ROUTE',resolverVersion:'fixture'};
          if(globalThis.__fixtureBookingRouteMode==='email')return{resolved:true,channel:'email',provider:'official_website',value:'reservierung@cafe.example',reason:'VERIFIED_EMAIL_FALLBACK',resolverVersion:'fixture'};
          return{resolved:false,channel:null,provider:null,value:null,reason:'NO_VERIFIED_ROUTE',resolverVersion:'fixture'};
        },
        recordPlaceHandoff:async(place,route)=>{globalThis.__journeyBookingReceipts.push({kind:'provider-handoff',place,route});return{ok:true}},
        createForPlace:async input=>{globalThis.__journeyBookingReceipts.push({kind:'email-create',input});return{id:'fixture-booking',contact:{email:'reservierung@cafe.example'}}},
        sendEmail:async(bookingId,input)=>{globalThis.__journeyBookingReceipts.push({kind:'email-send',bookingId,input});return{ok:true}}
      };
      globalThis.LuviaPlacesContractV1={reads:{recommend:async()=>({places:suggestions,plan:{ai:{fallback:false}}}),getCard:async id=>({place:suggestions.find(item=>item.providerPlaceId===id),image:suggestions.find(item=>item.providerPlaceId===id)?.image})},commands:{importPlace:async id=>({id,providerPlaceId:id,tripPlaceId:`trip-${id}`}),plan:async input=>{globalThis.__journeySuggestionReceipts.push(input);return{ok:true,action:'plan',...input}},updateLifecycle:async()=>({ok:true})}};
      globalThis.LuviaTripPreferenceContextV1={snapshot:()=>({trip:globalThis.LuviaTripContractV1.getActiveTrip(),profilePreferences:{travelPace:'relaxed',travelInterests:['culture']},tripComposition:{feelings:['curious','together']},resolution:{summary:{tripFeelings:['Neugier','Zeit füreinander'],profileHighlights:['Kultur']}}}),dayGuidance:graph=>({suggestion:{kind:'draft-place-discovery',requiresConfirmation:true,targetDate:graph.currentDay?.date||graph.days?.[0]?.date,startAt:graph.currentDay?.openGaps?.[0]?.startAt||graph.days?.[0]?.openGaps?.[0]?.startAt,query:'Ein passender gemeinsamer Reisemoment',reasons:['Neugier','Zeit füreinander']}})};
      globalThis.LuviaApp={show:view=>{globalThis.__lastFixtureView=view}};
    })();
  </script>
  <script src="../../core/runtime/overlay-host-contract-core.js"></script>
  <script src="../../core/ui/ui-manager.js"></script>
  <script src="../../core/platform/journey-contract-adapter.js"></script>
  <script src="../../core/booking/booking-ui.js"></script>
  <script src="../../core/platform/booking-contract-adapter.js"></script>
  <script src="../../app/journey/journey-suggestion-sheet.js"></script>
  <script src="../../app/journey/journey-day-composer.js"></script>
  <script>
    (()=>{const root=document.querySelector('[data-fixture-root]'),trip=globalThis.LuviaTripContractV1.getActiveTrip(),surface=new URL(location.href).searchParams.get('surface');root.innerHTML=surface==='timeline'?globalThis.LuviaJourneyDayComposer.renderTimeline(trip):globalThis.LuviaJourneyDayComposer.renderCalendar(trip);surface==='timeline'?globalThis.LuviaJourneyDayComposer.bindTimeline(root):globalThis.LuviaJourneyDayComposer.bindCalendar(root)})();
  </script>
</body>
</html>
