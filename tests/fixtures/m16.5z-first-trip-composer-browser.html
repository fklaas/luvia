<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <base href="../../">
  <title>Luvia M16.5Z — First Trip Composer</title>
  <link rel="stylesheet" href="../../app/first-trip-composer.css">
  <style>
    html,body,#app{width:100%;height:100%;margin:0}html.fixture-mobile,html.fixture-mobile body,html.fixture-mobile #app{width:390px;height:844px;max-width:390px;max-height:844px}body{overflow:hidden;background:#f5fafa}.fixture-result{min-height:100dvh;display:grid;place-items:center;padding:24px;font:16px Manrope,system-ui,sans-serif;color:#143247;background:linear-gradient(135deg,#f1faf8,#fff7f4)}.fixture-result article{width:min(620px,100%);padding:36px;border-radius:30px;background:white;box-shadow:0 30px 80px rgba(24,59,71,.14)}.fixture-result span{color:#2a947f;font-weight:850;letter-spacing:.12em}.fixture-result h1{font-size:clamp(38px,7vw,68px);line-height:.96;margin:10px 0}.fixture-result code{display:block;margin-top:20px;padding:14px;border-radius:14px;background:#edf5f5;word-break:break-all}
    .fixture-places-map{position:absolute;inset:0;overflow:hidden;background:linear-gradient(145deg,#d7efed,#b9dde2);font-family:Manrope,system-ui,sans-serif}.fixture-places-map svg{position:absolute;inset:0;width:100%;height:100%}.fixture-places-map .land{fill:#f5e9c8;stroke:#799c96;stroke-width:1.2}.fixture-places-map .coast{fill:none;stroke:#fff9df;stroke-width:14;opacity:.55}.fixture-places-map .route{fill:none;stroke:url(#fixture-route);stroke-width:3;stroke-dasharray:5 7;stroke-linecap:round;opacity:.78}.fixture-map-caption{position:absolute;top:18px;left:20px;display:grid;gap:3px;padding:9px 12px;border-radius:14px;background:#fffdf4df;box-shadow:0 8px 26px #315a6017;color:#244f58;backdrop-filter:blur(10px)}.fixture-map-caption small{font-size:8px;font-weight:800;letter-spacing:.14em;color:#be536c}.fixture-map-caption strong{font-size:13px}.fixture-map-pin{position:absolute;left:var(--x);top:var(--y);translate:-50% -50%;display:grid;place-items:center;width:24px;height:24px;padding:0;border:3px solid #fffaf0;border-radius:50% 50% 50% 10%;rotate:-45deg;background:var(--pin,#d35470);box-shadow:0 5px 17px #174f5850;cursor:pointer}.fixture-map-pin::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}.fixture-map-pin span{position:absolute;left:25px;top:2px;min-width:max-content;padding:4px 7px;border-radius:8px;rotate:45deg;background:#fffdf5e8;color:#315960;font-size:8px;font-weight:700;box-shadow:0 4px 12px #315a6012}.fixture-map-pin:nth-of-type(n+7) span{display:none}.fixture-map-pin:focus-visible{outline:3px solid #143f49;outline-offset:3px}
  </style>

<body>
  <main id="app"></main>
  <script>if(new URLSearchParams(location.search).get('viewport')==='mobile')document.documentElement.classList.add('fixture-mobile');</script>
  <script src="../../core/trips/trip-draft-core.js"></script>
  <script src="../../core/intelligence/intelligence-action-contract-core.js"></script>
  <script src="../../core/intelligence/trip-preference-resolution-core.js"></script>
  <script src="../../core/intelligence/intelligence-domain-contract-core.js"></script>
  <script src="../../core/platform/intelligence-contract-adapter.js"></script>
  <script src="../../core/journey/journey-resilience-core.js"></script>
  <script>
    window.LuviaAI={run:async(capability,request)=>{
      if(capability==='discovery.plan'){
        const fresh=(request?.excludedDestinations||[]).length>0,names=fresh?['Nizza','Dubrovnik','Alicante','Sardinien','Kreta']:['Lissabon','Valencia','Palma','Split','Málaga'];
        return {ok:true,meta:{fallback:false},data:{searchPlans:names.map(query=>({query})),reasoningSummary:fresh?'Fünf neue südliche Küstenrichtungen mit kurzer bis mittlerer Anreise.':'Fünf südliche Küstenrichtungen, die Wärme, Meer und eine überschaubare Anreise verbinden.'}};
      }
      if(capability==='trip.compose'){
        const days=(request.days||[]).map(day=>({...day,entries:[]})),catalog=request.candidateCatalog||[],target=Math.max(1,Number(request.planningContract?.targetMomentsPerDay)||3),minimum=Math.max(1,Number(request.planningContract?.minimumMomentsPerDay)||1),count=Math.min(target,Math.floor(catalog.length/Math.max(1,days.length))),moments=Math.max(minimum,count),policy=request.travelOrder?.policy||{},notBefore=/^\d\d:\d\d$/.test(policy.notBefore||'')?Number(policy.notBefore.slice(0,2))*60+Number(policy.notBefore.slice(3)):570,notAfter=/^\d\d:\d\d$/.test(policy.notAfter||'')?Number(policy.notAfter.slice(0,2))*60+Number(policy.notAfter.slice(3)):1260,templates={2:[600,1050],3:[570,840,1140],4:[540,750,960,1200]};
        let cursor=0;days.forEach((day,dayIndex)=>{let previousEnd=notBefore;for(let slot=0;slot<moments&&cursor<catalog.length;slot++,cursor++){const place=catalog[cursor],base=(templates[moments]||templates[3])[slot]??(600+slot*240),category=place.category,preferred=category==='food'?(slot===0?600:slot===moments-1?1140:750):category==='nightlife'?1200:category==='shopping'?660:category==='wellness'?630:category==='nature'||category==='water'||category==='photo'?Math.min(base,1020):base,minutes=Math.min(notAfter-90,Math.max(notBefore,previousEnd,preferred+(dayIndex%3)*15)),durationMinutes=category==='food'?90:120;previousEnd=minutes+durationMinutes+60;day.entries.push({providerPlaceId:place.providerPlaceId,time:`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`,durationMinutes,category:place.category,reason:`${place.name} verbindet den Reiseauftrag mit dem ${slot===0?'ruhigen Beginn':slot===moments-1?'Abend':'Tagesverlauf'}.`,confidence:.92});}});
        return {ok:true,meta:{fallback:false},data:{title:'Eure Reise als zusammenhängender Entwurf',summary:'Luvia hat Ziel, Reisezeit, Profil und Reisewünsche gemeinsam ausgewertet.',days:days.map((day,index)=>({...day,theme:['Ankommen und orientieren','Küste, Kultur und Genuss','Freiraum mit einem besonderen Abend'][index%3]})),alternatives:catalog.slice(cursor).map(place=>place.providerPlaceId),uncoveredRequirements:[],warnings:[],confidence:.92}};
      }
      return {ok:true,meta:{fallback:false},data:{understanding:'Wir planen ruhige Tage mit Kultur und veganem Essen, ab zwölf Uhr.',goals:[{type:'culture',label:'Kultur erleben',hardConstraints:[],softPreferences:[]}],hardConstraints:[{key:'dietary',value:'vegan',label:'Vegan essen'},{key:'notBefore',value:'12:00',label:'Ab zwölf Uhr'}],softPreferences:[{key:'pace',value:'slow',label:'Ein ruhiger Tag'}],followUpQuestion:null,unknowns:[],confidence:.93}};
    }};
    const fixtureParams=new URLSearchParams(location.search);
    const fixtureUserId=`m165z-${fixtureParams.get('qa')||'visible-user'}`;
    const storagePrefix=`m165z-fixture:${fixtureUserId}:`;
    const StoragePort={
      get:(key,fallback)=>{const value=sessionStorage.getItem(`${storagePrefix}${key}`);return value===null?fallback:JSON.parse(value)},
      set:(key,value)=>{sessionStorage.setItem(`${storagePrefix}${key}`,JSON.stringify(value));return value},
      remove:key=>sessionStorage.removeItem(`${storagePrefix}${key}`)
    };
    window.LuviaPlatformPorts={get:name=>name==='StoragePort'?StoragePort:name==='AuthSessionPort'?{snapshot:()=>({user:{id:fixtureUserId},email:'fabian@example.test'})}:null};
    window.LuviaIdentityContractV1={getViewerIdentity:()=>({userId:fixtureUserId}),reads:{getPreferences:()=>({dietaryPreferences:['vegetarian'],travelInterests:['culture','nature']})}};
    window.LuviaNavigationContractV1={createIntent:(route,options)=>({route,params:options?.params||{}})};
    window.LuviaNavigationHistoryV1={project:(intent,options={})=>{const url=new URL(location.href);url.searchParams.set('step',intent.params.tripStep);history[options.replace?'replaceState':'pushState']({tripStep:intent.params.tripStep},'',url);return true}};
    const destinations={
      lisbon:{name:'Lissabon',formattedAddress:'Lissabon, Portugal',country:'Portugal',countryCode:'PT',placeId:'fixture-lisbon',location:{latitude:38.7223,longitude:-9.1393}},
      valencia:{name:'Valencia',formattedAddress:'Valencia, Spanien',country:'Spanien',countryCode:'ES',placeId:'fixture-valencia',location:{latitude:39.4699,longitude:-0.3763}},
      palma:{name:'Palma',formattedAddress:'Palma, Mallorca, Spanien',country:'Spanien',countryCode:'ES',placeId:'fixture-palma',location:{latitude:39.5696,longitude:2.6502}},
      split:{name:'Split',formattedAddress:'Split, Kroatien',country:'Kroatien',countryCode:'HR',placeId:'fixture-split',location:{latitude:43.5081,longitude:16.4402}},
      malaga:{name:'Málaga',formattedAddress:'Málaga, Spanien',country:'Spanien',countryCode:'ES',placeId:'fixture-malaga',location:{latitude:36.7213,longitude:-4.4214}},
      nice:{name:'Nizza',formattedAddress:'Nizza, Frankreich',country:'Frankreich',countryCode:'FR',placeId:'fixture-nice',location:{latitude:43.7102,longitude:7.262}},
      dubrovnik:{name:'Dubrovnik',formattedAddress:'Dubrovnik, Kroatien',country:'Kroatien',countryCode:'HR',placeId:'fixture-dubrovnik',location:{latitude:42.6507,longitude:18.0944}},
      alicante:{name:'Alicante',formattedAddress:'Alicante, Spanien',country:'Spanien',countryCode:'ES',placeId:'fixture-alicante',location:{latitude:38.3452,longitude:-0.481}},
      sardinia:{name:'Sardinien',formattedAddress:'Sardinien, Italien',country:'Italien',countryCode:'IT',placeId:'fixture-sardinia',location:{latitude:40.1209,longitude:9.0129}},
      crete:{name:'Kreta',formattedAddress:'Kreta, Griechenland',country:'Griechenland',countryCode:'GR',placeId:'fixture-crete',location:{latitude:35.2401,longitude:24.8093}},
      scharbeutz:{name:'Scharbeutz',formattedAddress:'Scharbeutz, Deutschland',country:'Deutschland',countryCode:'DE',placeId:'fixture-scharbeutz',location:{latitude:54.0212,longitude:10.7504}}
    };
    const fixturePlaces=[
      {providerPlaceId:'fixture-food-1',name:'Kysten Frühstück',primaryType:'restaurant',requestCategory:'food',formattedAddress:'Hafenstraße 1, Scharbeutz',coordinates:{latitude:54.023,longitude:10.752},image:{url:'assets/public-landing/prototype-harbor-lunch.png'}},
      {providerPlaceId:'fixture-food-2',name:'Vegetarisches Strandhaus',primaryType:'restaurant',requestCategory:'food',formattedAddress:'Strandallee 20, Scharbeutz',coordinates:{latitude:54.025,longitude:10.755},image:{url:'assets/public-landing/prototype-coast-morning.png'}},
      {providerPlaceId:'fixture-food-3',name:'Kleine Küstenküche',primaryType:'cafe',requestCategory:'food',formattedAddress:'Seestraße 4, Scharbeutz',coordinates:{latitude:54.019,longitude:10.748},image:{url:'assets/public-landing/prototype-harbor-lunch.png'}},
      {providerPlaceId:'fixture-culture-1',name:'Galerie am Meer',primaryType:'museum',requestCategory:'culture',formattedAddress:'Promenade 8, Scharbeutz',coordinates:{latitude:54.026,longitude:10.757},image:{url:'assets/public-landing/prototype-memory-sunset.png'}},
      {providerPlaceId:'fixture-culture-2',name:'Küstenatelier',primaryType:'art_gallery',requestCategory:'culture',formattedAddress:'Dünenweg 3, Scharbeutz',coordinates:{latitude:54.017,longitude:10.744},image:{url:'assets/public-landing/prototype-coast-bike.png'}},
      {providerPlaceId:'fixture-culture-3',name:'Heimatmuseum',primaryType:'museum',requestCategory:'culture',formattedAddress:'Markt 5, Scharbeutz',coordinates:{latitude:54.021,longitude:10.746},image:{url:'assets/public-landing/prototype-memory-sunset.png'}},
      {providerPlaceId:'fixture-active-1',name:'Küsten-Radmoment',primaryType:'tourist_attraction',requestCategory:'activities',formattedAddress:'Strandweg 11, Scharbeutz',coordinates:{latitude:54.029,longitude:10.761},image:{url:'assets/public-landing/prototype-coast-bike.png'}},
      {providerPlaceId:'fixture-active-2',name:'Dünenpfad',primaryType:'park',requestCategory:'activities',formattedAddress:'Am Kurpark, Scharbeutz',coordinates:{latitude:54.018,longitude:10.751},image:{url:'assets/public-landing/prototype-coast-morning.png'}},
      {providerPlaceId:'fixture-active-3',name:'Wassersportbucht',primaryType:'sports_activity_location',requestCategory:'activities',formattedAddress:'Seebrücke, Scharbeutz',coordinates:{latitude:54.024,longitude:10.759},image:{url:'assets/public-landing/prototype-coast-bike.png'}}
    ];
    window.LuviaPlacesContractV1={
      contractId:'places.v1',
      reads:{
        // Controlled route evidence for UI testing only, never a live provider claim.
        getRoute:async(from,to,{mode}={})=>({verified:true,provider:'here',durationMinutes:mode==='BICYCLE'?7:18,observedAt:new Date().toISOString(),geometry:{type:'LineString',coordinates:[[from.longitude,from.latitude],[to.longitude,to.latitude]]}}),
        suggestDestinations:async value=>({
          owner:'places',
          contractId:'places.v1',
          sessionToken:'fixture-session',
          suggestions:Object.values(destinations)
            .filter(place=>`${place.name} ${place.country}`.toLowerCase().includes(String(value).toLowerCase()))
            .map(place=>({placeId:place.placeId,text:place.formattedAddress}))
        }),
        getDestination:async placeId=>{
        const place=Object.values(destinations).find(item=>item.placeId===placeId);
        return {
          owner:'places',
          contractId:'places.v1',
          placeId:place.placeId,
          name:place.name,
          formattedAddress:place.formattedAddress,
          country:place.country,
          countryCode:place.countryCode,
          latitude:place.location.latitude,
          longitude:place.location.longitude,timezone:({PT:'Europe/Lisbon',ES:'Europe/Madrid',HR:'Europe/Zagreb',FR:'Europe/Paris',IT:'Europe/Rome',GR:'Europe/Athens',DE:'Europe/Berlin'})[place.countryCode]||'Europe/Berlin'
        };
        },
        getActiveDiscovery:()=>null,
        recommend:async options=>{await new Promise(resolve=>setTimeout(resolve,180));const center=options.destination?.center||{lat:54.0212,lng:10.7504},destinationName=options.destination?.name||'Scharbeutz',category=options.category||'activities',source=fixturePlaces.filter(place=>place.requestCategory===category),fallback=fixturePlaces.filter(place=>place.requestCategory==='activities'),labels={food:'Küstenküche',culture:'Kulturmoment',nature:'Naturpfad',water:'Strandmoment',sights:'Entdeckung',shopping:'Lieblingsladen',nightlife:'Abendort',wellness:'Ruheort',photo:'Aussichtspunkt',themeparks:'Familienerlebnis',activities:'Aktivität'},types={food:'restaurant',culture:'museum',nature:'park',water:'tourist_attraction',sights:'tourist_attraction',shopping:'store',nightlife:'bar',wellness:'spa',photo:'observation_deck',themeparks:'amusement_park',activities:'sports_activity_location'},places=Array.from({length:8},(_,index)=>{const seed=source[index%Math.max(1,source.length)]||fallback[index%fallback.length]||fixturePlaces[index%fixturePlaces.length];return {...seed,providerPlaceId:`fixture-${category}-${index+1}`,name:index<source.length?seed.name:`${labels[category]||'Reisemoment'} ${index+1}`,primaryType:types[category]||seed.primaryType,requestCategory:category,formattedAddress:`${destinationName} · kontrollierter Place`,coordinates:{latitude:center.lat+((index%4)-1.5)*.005,longitude:center.lng+(Math.floor(index/4)-.5)*.008}}});return {owner:'places',contractId:'places.v1',places,count:places.length,evidenceContract:{verified:true}}}
      }
    };
    window.LuviaPlacesSpatialExperience={mountProjection:(container,places,options={})=>{const palette=['#ef6f61','#e5a540','#49a08f','#3b9fb4','#7686b9','#9a72b1','#ce6685'],draw=()=>{const points=places.map((place,index)=>({place,index,x:18+(index*23)%69,y:27+(index*31)%54})),route=points.map((point,index)=>(index?'L':'M')+point.x+' '+point.y).join(' ');container.innerHTML=`<div class="fixture-places-map"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="fixture-route"><stop stop-color="#ef6f61"/><stop offset=".2" stop-color="#e5a540"/><stop offset=".45" stop-color="#49a08f"/><stop offset=".7" stop-color="#3b9fb4"/><stop offset="1" stop-color="#a26fab"/></linearGradient></defs><path class="coast" d="M-6 77 C16 55 25 69 43 45 S77 34 106 17"/><path class="land" d="M-8 82 C15 57 27 72 45 49 S78 39 108 19 L108 108 L-8 108Z"/><path class="route" d="${route}"/></svg><div class="fixture-map-caption"><small>EURE ORTE AUF EINEN BLICK</small><strong>${places.length} belegte Places</strong></div>${points.map(({place,index,x,y})=>`<button type="button" class="fixture-map-pin" data-fixture-map-select="${place.providerPlaceId}" style="--x:${x}%;--y:${y}%;--pin:${palette[index%palette.length]}" aria-label="${place.name} aufrufen"><span>${place.name}</span></button>`).join('')}</div>`;container.querySelectorAll('[data-fixture-map-select]').forEach(button=>button.addEventListener('click',()=>options.onSelect?.(button.dataset.fixtureMapSelect)));};draw();return {update:next=>{places=next;draw()},destroy:()=>{container.innerHTML=''}}}};
    window.LuviaJourneyContractV1={reads:{rehearseDay:input=>LuviaJourneyResilienceCoreV1.rehearseDay(input)}};
    const dayDraftReceipts=[],preparedActions=new Map();
    window.LuviaAIActionRuntime={prepare:(actionId,payload,options)=>{const check=LuviaIntelligenceActionContractCoreV1.validateActionInput(actionId,payload,{timeZone:options.timeZone});if(!check.valid)throw Error(JSON.stringify(check.issues));const ledgerId=options.idempotencyKey;preparedActions.set(ledgerId,{actionId,payload,options});return {ledgerId,requiresConfirmation:true}},execute:async(actionId,payload,options)=>{const request=preparedActions.get(options.ledgerId);const receipt=LuviaIntelligenceActionContractCoreV1.createReceipt({actionId,status:'completed',ownerCommand:true,ledgerId:options.ledgerId,idempotencyKey:request.options.idempotencyKey,reference:{tripId:request.payload.tripId,providerPlaceId:request.payload.providerPlaceId,readbackVerified:true}});dayDraftReceipts.push(receipt);return receipt}};
    const trips=[];
    window.LuviaTripContractV1={
      reads:{listTrips:()=>trips},
      composition:{composeDayDraft:(draft,sources)=>window.LuviaTripDraftCoreV1.composeDayDraft(draft,sources)},
      commands:{
        createFirstTrip:async(input,options)=>{
          await new Promise(resolve=>setTimeout(resolve,500));
          const trip={id:'trip-m165z-visible',...input};
          trips.push(trip);
          return Object.freeze({
            owner:'trip',
            contractId:'trip.v1',
            action:'trip.first.create',
            status:'committed',
            idempotencyKey:options.idempotencyKey,
            tripId:trip.id,
            activeTripId:trip.id,
            committedAt:new Date().toISOString(),
            trip,
            collaborationHandoff:{
              status:input.participantPlan==='invite-after-creation'?'required':'not-requested',
              owner:'collaboration',
              contractId:'collaboration.membership.v1',
              availability:'reserved'
            }
          });
        }
      }
    };
  </script>
  <script src="../../app/composer-travel-world.js"></script>
  <script src="../../app/first-trip-composer.js"></script>
  <script>
    const mountComposer=()=>{
      const params=new URLSearchParams(location.search),step=params.get('step')||'welcome';
      window.LuviaFirstTripComposer.mount(document.getElementById('app'),{mode:'first-use',step,onCancel:()=>location.reload(),onComplete:receipt=>{document.getElementById('app').className='';document.getElementById('app').innerHTML=`<section class="fixture-result" data-ftc-complete><article><span>TRIP UND TAGESENTWURF BESTÄTIGT</span><h1>Eure Reise ist aktiv.</h1><p>Dieser lokale Test hat den Composer und ${receipt.dayDraftReceipts?.length||0} simulierte Schreibaktionen mit echten Vertragsregeln durchlaufen.</p><code>${receipt.action} · ${receipt.tripId} · ${receipt.collaborationHandoff.availability}</code></article></section>`}});
    };
    addEventListener('popstate',mountComposer);
    mountComposer();
  </script>
