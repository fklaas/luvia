</head>
<body>
  <div id="app" aria-busy="true"></div>
  <script>
    (() => {
      'use strict';
      const state = { loading: false, authenticated: true, session: { access_token: 'fixture-only' }, user: { id: 'fixture-user' }, anonymous: false, identities: [] };
      window.__m165sFixture = { passwordUpdates: [], completed: false };
      window.LuviaAuth = Object.freeze({
        getState: () => state,
        updatePassword: async password => { window.__m165sFixture.passwordUpdates.push(password.length); },
        resetPassword: async () => {},
        signIn: async () => {},
        signUp: async () => {},
        signInWithProvider: async () => {}
      });
      window.LuviaApp = Object.freeze({ render: async () => { window.__m165sFixture.completed = true; document.body.dataset.recoveryComplete = 'true'; } });
    })();
  </script>
  <script src="../../auth/ui.js?v=13.82.159"></script>
  <script src="../../core/experience/experience-contract-core.js?v=13.82.159"></script>

  <script src="../../app/public-landing-experience-motion.js?v=13.82.159"></script>
  <script src="../../app/public-entry.js?v=13.82.159"></script>
  <script>
    window.addEventListener('load', () => window.LuviaGuidedJourneyEntry.render(document.getElementById('app'), { authMode: 'recovery' }));
  </script>
