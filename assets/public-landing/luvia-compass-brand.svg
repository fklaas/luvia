<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Luvia Living Compass</title>
  <desc id="desc">Ein heller, räumlich ausgearbeiteter Reisekompass mit einem geschlossenen Ringverlauf von Rot über Orange, Blau und Grün zurück zu Rot.</desc>
  <defs>
    <radialGradient id="paper" cx="34%" cy="24%" r="82%"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#fffdfa"/><stop offset=".76" stop-color="#f8f3ed"/><stop offset="1" stop-color="#e5f3f4"/></radialGradient>
    <radialGradient id="dial" cx="40%" cy="30%" r="74%"><stop stop-color="#ffffff" stop-opacity=".98"/><stop offset=".68" stop-color="#fffaf6" stop-opacity=".9"/><stop offset="1" stop-color="#dcecee" stop-opacity=".72"/></radialGradient>
    <linearGradient id="ring-ne" x1="64" y1="5" x2="123" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#ef6254"/><stop offset="1" stop-color="#f4b34c"/></linearGradient>
    <linearGradient id="ring-es" x1="123" y1="64" x2="64" y2="123" gradientUnits="userSpaceOnUse"><stop stop-color="#f4b34c"/><stop offset="1" stop-color="#2c93a9"/></linearGradient>
    <linearGradient id="ring-sw" x1="64" y1="123" x2="5" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#2c93a9"/><stop offset="1" stop-color="#2f8c73"/></linearGradient>
    <linearGradient id="ring-wn" x1="5" y1="64" x2="64" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#2f8c73"/><stop offset="1" stop-color="#ef6254"/></linearGradient>
    <linearGradient id="eye" x1="52" y1="58" x2="76" y2="78" gradientUnits="userSpaceOnUse"><stop stop-color="#ef6254"/><stop offset=".52" stop-color="#f4b34c"/><stop offset="1" stop-color="#2c93a9"/></linearGradient>
    <linearGradient id="north" x1="48" y1="35" x2="76" y2="77" gradientUnits="userSpaceOnUse"><stop stop-color="#ffb09f"/><stop offset=".28" stop-color="#f36b5c"/><stop offset=".72" stop-color="#e94f49"/><stop offset="1" stop-color="#f58d5e"/></linearGradient>
    <linearGradient id="south" x1="48" y1="67" x2="79" y2="99" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset=".46" stop-color="#b8dfe5"/><stop offset=".72" stop-color="#2c93a9"/><stop offset="1" stop-color="#2f8c73"/></linearGradient>
    <radialGradient id="hub" cx="38%" cy="30%" r="74%"><stop stop-color="#ffffff"/><stop offset=".58" stop-color="#fffaf4"/><stop offset="1" stop-color="#f2e6dc"/></radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="185%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#102c43" flood-opacity=".19"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ec6555" flood-opacity=".11"/></filter>
    <filter id="needleShadow" x="-45%" y="-35%" width="190%" height="190%"><feDropShadow dx="0" dy="4" stdDeviation="3.2" flood-color="#15374d" flood-opacity=".22"/></filter>
    <filter id="hubShadow" x="-60%" y="-60%" width="220%" height="230%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#15374d" flood-opacity=".18"/></filter>
  </defs>
