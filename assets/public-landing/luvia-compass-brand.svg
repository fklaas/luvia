  <circle cx="64" cy="15" r="4.25" fill="#ef6254" stroke="#fff" stroke-width="2"/><circle cx="113" cy="64" r="3.75" fill="#f4b34c" stroke="#fff" stroke-width="2"/><circle cx="64" cy="113" r="3.75" fill="#2c93a9" stroke="#fff" stroke-width="2"/><circle cx="15" cy="64" r="3.75" fill="#2f8c73" stroke="#fff" stroke-width="2"/>
